<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainrot Clicker & Cases</title>
    <!-- Подключаем Telegram Web App SDK для определения никнейма -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }
        h1 {
            color: #e94560;
            margin-bottom: 5px;
            font-size: 22px;
        }
        .score-container {
            font-size: 28px;
            margin: 10px 0;
            font-weight: bold;
            color: #0fff95;
        }
        /* Блок энергии */
        .energy-container {
            font-size: 16px;
            margin-bottom: 15px;
            color: #ffde59;
            font-weight: bold;
        }
        .energy-bar-bg {
            width: 80%;
            max-width: 250px;
            height: 12px;
            background: #16213e;
            border-radius: 6px;
            margin: 5px auto;
            border: 2px solid #0f3460;
            overflow: hidden;
        }
        .energy-bar-fill {
            width: 100%;
            height: 100%;
            background: #ffde59;
            transition: width 0.3s ease;
        }
        /* Кликер с персонажем */
        .clicker-box {
            position: relative;
            display: inline-block;
            margin: 10px 0;
            cursor: pointer;
            user-select: none;
        }
        .character-img {
            width: 180px;
            height: 180px;
            border-radius: 20px;
            border: 4px solid #e94560;
            object-fit: cover;
            background-color: #16213e;
            box-shadow: 0 8px 20px rgba(233, 69, 96, 0.4);
            transition: transform 0.1s ease;
        }
        .clicker-box:active .character-img {
            transform: scale(0.92);
        }
        /* Анимация всплывающего +1 */
        .floating-text {
            position: absolute;
            font-size: 24px;
            font-weight: bold;
            color: #0fff95;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-60px) scale(1.3);
            }
        }
        /* Секция кейсов и скинов */
        .cases-section {
            background: #16213e;
            border-radius: 15px;
            padding: 15px;
            margin-top: 15px;
            border: 2px solid #0f3460;
        }
        .btn {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(233, 69, 96, 0.3);
            transition: background 0.2s;
        }
