<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mini App Clicker & Cases</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #12131C;
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Шапка с профилем */
        .header {
            background: #1A1C29;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #6B73FF, #000DFF);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .balance-card {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            color: #FFD700;
        }

        /* Контент навигации */
        .tab-content {
            flex: 1;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .tab-content.active {
            display: flex;
        }

        /* Кликер */
        .clicker-container {
            text-align: center;
        }

        .coin-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, #FFE066 0%, #F59E0B 100%);
            border: 8px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(245, 158, 11, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            cursor: pointer;
            transition: transform 0.05s ease;
            margin: 30px auto;
        }

        .coin-btn:active {
            transform: scale(0.93);
        }

        .energy-bar-container {
            width: 100%;
            max-width: 250px;
            background: rgba(255, 255, 255, 0.1);
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 10px;
        }

        .energy-fill {
            height: 100%;
            background: #10B981;
            width: 100%;
            transition: width 0.2s ease;
        }

        /* Кейсы */
        .case-card {
            background: #1A1C29;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 300px;
            text-align: center;
            margin-bottom: 15px;
        }

        .case-icon {
            font-size: 60px;
            margin-bottom: 10px;
        }

        .btn {
            background: #3B82F6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .btn:disabled {
            background: #4B5563;
            opacity: 0.6;
        }

        /* Инвентарь */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 320px;
        }

        .inventory-item {
            background: #1A1C29;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        /* Нижнее меню */
        .bottom-nav {
            background: #1A1C29;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-item {
            color: #9CA3AF;
            text-decoration: none;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .nav-item.active {
            color: #3B82F6;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Шапка профиля -->
    <div class="header">
        <div class="user-info">
            <div class="avatar" id="avatar">U</div>
            <div>
                <div id="username" style="font-weight: bold; font-size: 14px;">Игрок</div>
                <div style="font-size: 11px; color: #9CA3AF;">Фермер</div>
            </div>
        </div>
        <div class="balance-card">
            🪙 <span id="balance">0</span>
        </div>
    </div>

    <!-- Вкладка Кликер -->
    <div id="clickerTab" class="tab-content active">
        <div class="clicker-container">
            <h2>Тапай и фарми!</h2>
            <div class="coin-btn" onclick="clickCoin()">💰</div>
            <div style="color: #9CA3AF; font-size: 14px;">
                Энергия: <span id="energyText">100/100</span>
            </div>
            <div class="energy-bar-container">
                <div class="energy-fill" id="energyFill"></div>
            </div>
        </div>
    </div>

    <!-- Вкладка Кейсы -->
    <div id="casesTab" class="tab-content">
        <div class="case-card">
            <div class="case-icon">📦</div>
            <h3>Обычный кейс</h3>
            <p style="color: #9CA3AF; font-size: 12px; margin-top: 4px;">Содержит случайные скины</p>
            <button class="btn" onclick="openCase()" id="openCaseBtn">Открыть (50 🪙)</button>
        </div>
        <div id="dropResult" style="margin-top: 15px; font-size: 16px; font-weight: bold;"></div>
    </div>

    <!-- Вкладка Инвентарь -->
    <div id="inventoryTab" class="tab-content">
        <h3 style="margin-bottom: 15px;">Мои скины</h3>
        <div class="inventory-grid" id="inventoryGrid">
            <div style="grid-column: span 2; text-align: center; color: #9CA3AF;">Инвентарь пуст</div>
        </div>
    </div>

    <!-- Нижнее меню -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('clickerTab', this)">
            <span style="font-size: 18px;">⚡</span>
            <span>Кликер</span>
        </div>
        <div class="nav-item" onclick="switchTab('casesTab', this)">
            <span style="font-size: 18px;">🎁</span>
            <span>Кейсы</span>
        </div>
        <div class="nav-item" onclick="switchTab('inventoryTab', this)">
            <span style="font-size: 18px;">🎒</span>
            <span>Инвентарь</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let coins = 0;
        let energy = 100;
        const maxEnergy = 100;
        let inventory = [];

        // Инициализация профиля из Telegram
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('username').innerText = user.first_name;
            document.getElementById('avatar').innerText = user.first_name[0].toUpperCase();
        }

        // Кликер
        function clickCoin() {
            if (energy > 0) {
                coins += 1;
                energy -= 1;
                updateUI();
            }
        }

        // Восстановление энергии
        setInterval(() => {
            if (energy < maxEnergy) {
                energy += 1;
                updateUI();
            }
        }, 7000);

        function updateUI() {
            document.getElementById('balance').innerText = coins;
            document.getElementById('energyText').innerText = `${energy}/${maxEnergy}`;
            document.getElementById('energyFill').style.width = `${(energy / maxEnergy) * 100}%`;
            document.getElementById('openCaseBtn').disabled = coins < 50;
        }

        // Переключение вкладок
        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            el.classList.add('active');
        }

        // Открытие кейсов
        const drops = [
            { name: "Обычный ножик", rarity: "⚪ Обычный", icon: "🔪" },
            { name: "Золотой AK-47", rarity: "🟡 Легендарный", icon: "🔫" },
            { name: "Неоновый шлем", rarity: "🟣 Редкий", icon: "🪖" },
            { name: "Ржавый пистолет", rarity: "⚪ Обычный", icon: "🔫" }
        ];

        function openCase() {
            if (coins >= 50) {
                coins -= 50;
                const randomDrop = drops[Math.floor(Math.random() * drops.length)];
                inventory.push(randomDrop);
                
                document.getElementById('dropResult').innerText = `Выпало: ${randomDrop.icon} ${randomDrop.name} (${randomDrop.rarity})`;
                renderInventory();
                updateUI();
            }
        }

        function renderInventory() {
            const grid = document.getElementById('inventoryGrid');
            if (inventory.length === 0) return;
            
            grid.innerHTML = inventory.map(item => `
                <div class="inventory-item">
                    <div style="font-size: 30px;">${item.icon}</div>
                    <div style="font-weight: bold; font-size: 13px; margin-top: 4px;">${item.name}</div>
                    <div style="font-size: 10px; color: #9CA3AF;">${item.rarity}</div>
                </div>
            `).join('');
        }

        updateUI();
    </script>
</body>
</html>
