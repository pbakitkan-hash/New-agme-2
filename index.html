<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Brainrot Case</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --accent: #f3ba2f;
            --text-color: #ffffff;
            --secondary-text: #a1a1aa;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--card-bg);
            border-bottom: 1px solid #27272a;
        }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 36px; height: 36px; background: #52525b; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .balance { background: #27272a; padding: 6px 12px; border-radius: 20px; font-weight: bold; color: var(--accent); display: flex; align-items: center; gap: 5px; }
        
        .content { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; overflow-y: auto; }
        .content.active { display: flex; }

        .clicker-container { position: relative; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .tap-target {
            width: 220px;
            height: 220px;
            background: linear-gradient(135deg, #f3ba2f, #d97706);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(243, 186, 47, 0.3);
            transition: transform 0.1s ease;
        }
        .tap-target:active { transform: scale(0.92); }
        .tap-title { font-size: 14px; color: #451a03; font-weight: bold; margin-top: 5px; }

        .energy-bar-container { width: 80%; max-width: 300px; background: #27272a; height: 12px; border-radius: 6px; margin-top: 25px; overflow: hidden; }
        .energy-bar { background: #22c55e; height: 100%; width: 100%; transition: width 0.3s; }

        .case-card { background: var(--card-bg); border: 1px solid #27272a; padding: 20px; border-radius: 16px; width: 100%; max-width: 320px; margin-bottom: 15px; }
        .btn { background: var(--accent); color: #000; border: none; padding: 12px 24px; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; }
        .btn:active { opacity: 0.8; }

        .inventory-list { width: 100%; max-width: 350px; text-align: left; max-height: 50vh; overflow-y: auto; }
        .inv-item { background: var(--card-bg); padding: 10px 15px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #27272a; }
        .sell-btn { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; }

        nav { display: flex; background: var(--card-bg); border-top: 1px solid #27272a; padding: 10px 0; }
        .nav-item { flex: 1; text-align: center; color: var(--secondary-text); font-size: 12px; cursor: pointer; background: none; border: none; }
        .nav-item.active { color: var(--accent); }
        .nav-item div { font-size: 20px; margin-bottom: 2px; }

        .floating-text {
            position: absolute;
            color: #22c55e;
            font-weight: bold;
            font-size: 24px;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-60px) scale(1.3); opacity: 0; }
        }
    </style>
</head>
<body>

    <header>
        <div class="user-info">
            <div class="avatar" id="user-initial">P</div>
            <div>
                <div id="username" style="font-weight: bold; font-size: 14px;">parasat</div>
                <div style="font-size: 11px; color: var(--secondary-text);">Фермер</div>
            </div>
        </div>
        <div class="balance">🪙 <span id="balance-val">0</span></div>
    </header>

    <div id="tab-clicker" class="content active">
        <h2>Тапай и фарми!</h2>
        <div class="clicker-container" id="tap-zone">
            <div class="tap-target">
                <span style="font-size: 55px;">🍕🤖</span>
                <div class="tap-title">Нубинни Пицанини</div>
            </div>
        </div>
        <div class="energy-bar-container">
            <div class="energy-bar" id="energy-bar"></div>
        </div>
        <div style="margin-top: 10px; font-size: 13px; color: var(--secondary-text);">Энергия: <span id="energy-val">100</span>/100</div>
    </div>

    <div id="tab-cases" class="content">
        <div class="case-card">
            <h3>Обычный кейс</h3>
            <p style="font-size: 13px; color: var(--secondary-text);">Содержит случайные скины</p>
            <p id="case-result" style="min-height: 40px; margin: 10px 0; font-weight: bold; color: var(--accent);">Нажми открыть!</p>
            <button class="btn" onclick="openCase()">Открыть (50 🪙)</button>
        </div>
    </div>

    <div id="tab-inventory" class="content">
        <h3>Твой инвентарь</h3>
        <div class="inventory-list" id="inventory-container">
            <p style="color: var(--secondary-text); text-align: center;">Инвентарь пуст</p>
        </div>
    </div>

    <nav>
        <button class="nav-item active" onclick="switchTab('clicker', this)">
            <div>⚡</div>Кликер
        </button>
        <button class="nav-item" onclick="switchTab('cases', this)">
            <div>🎁</div>Кейсы
        </button>
        <button class="nav-item" onclick="switchTab('inventory', this)">
            <div>🎒</div>Инвентарь
        </button>
    </nav>

    <script>
        let balance = parseInt(localStorage.getItem('brainrot_balance')) || 100;
        let energy = 100;
        let inventory = JSON.parse(localStorage.getItem('brainrot_inv')) || [];

        const balanceEl = document.getElementById('balance-val');
        const energyEl = document.getElementById('energy-val');
        const energyBar = document.getElementById('energy-bar');

        function updateUI() {
            balanceEl.innerText = balance;
            energyEl.innerText = energy;
            energyBar.style.width = energy + '%';
            
            localStorage.setItem('brainrot_balance', balance);
            localStorage.setItem('brainrot_inv', JSON.stringify(inventory));
            renderInventory();
        }

        const tapZone = document.getElementById('tap-zone');
        tapZone.addEventListener('click', (e) => {
            if (energy >= 1) {
                balance += 1;
                energy -= 1;
                updateUI();

                let rect = tapZone.getBoundingClientRect();
                let x = e.clientX - rect.left;
                let y = e.clientY - rect.top;
                
                let floatText = document.createElement('div');
                floatText.className = 'floating-text';
                floatText.innerText = '+1';
                floatText.style.left = x + 'px';
                floatText.style.top = y + 'px';
                tapZone.appendChild(floatText);

                setTimeout(() => floatText.remove(), 800);
            }
        });

        setInterval(() => {
            if (energy < 100) {
                energy += 2;
                if (energy > 100) energy = 100;
                updateUI();
            }
        }, 1000);

        const possibleDrops = [
            { name: "🟢 Неоновый шлем (Редкий)", price: 30 },
            { name: "🟡 Золотой АК-47 (Легендарный)", price: 100 },
            { name: "🔵 Синий керамбит (Эпический)", price: 60 },
            { name: "⚪ Ржавый болт (Обычный)", price: 10 }
        ];

        function openCase() {
            if (balance >= 50) {
                balance -= 50;
                let drop = possibleDrops[Math.floor(Math.random() * possibleDrops.length)];
                inventory.push(drop);
                updateUI();
                document.getElementById('case-result').innerText = `Выпало: ${drop.name}`;
            } else {
                alert('Не хватает монеток!');
            }
        }

        function renderInventory() {
            const container = document.getElementById('inventory-container');
            if (inventory.length === 0) {
                container.innerHTML = '<p style="color: var(--secondary-text); text-align: center;">Инвентарь пуст</p>';
                return;
            }
            container.innerHTML = '';
            inventory.forEach((item, index) => {
                let div = document.createElement('div');
                div.className = 'inv-item';
                div.innerHTML = `
                    <span>${item.name}</span>
                    <button class="sell-btn" onclick="sellItem(${index})">Продать (+${item.price} 🪙)</button>
                `;
                container.appendChild(div);
            });
        }

        function sellItem(index) {
            let item = inventory[index];
            balance += item.price;
            inventory.splice(index, 1);
            updateUI();
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).classList.add('active');
            btn.classList.add('active');
        }

        updateUI();
    </script>
</body>
</html>
